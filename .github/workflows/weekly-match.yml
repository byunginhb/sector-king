name: Weekly Match

on:
  schedule:
    - cron: '17 9 * * *'
    - cron: '47 13 * * *'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: weekly-match-single-round
  cancel-in-progress: false

jobs:
  plan:
    if: github.repository == 'byunginhb/sector-king' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      matrix: ${{ steps.discover.outputs.matrix }}
      has_work: ${{ steps.discover.outputs.has_work }}
      artifact_name: ${{ steps.discover.outputs.artifact_name }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: scripts/requirements-weekly-match.txt
      - name: Install review calendar
        run: python3 -m pip install --disable-pip-version-check -r scripts/requirements-weekly-match.txt
      - name: Validate planner, review and runner
        run: python3 -m unittest discover -s scripts -p 'test*weekly_match*.py' -v
      - name: Discover future and unfinished rounds
        id: discover
        run: |
          python3 scripts/automate_weekly_match.py
          echo "artifact_name=weekly-match-plan-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_OUTPUT"
      - name: Retain immutable operation plan
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.discover.outputs.artifact_name }}
          path: .weekly-match-plan/
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 90

  operate:
    needs: plan
    if: needs.plan.outputs.has_work == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      review_passed: ${{ steps.prepare.outputs.review_passed }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: scripts/requirements-weekly-match.txt
      - name: Install review calendar
        run: python3 -m pip install --disable-pip-version-check -r scripts/requirements-weekly-match.txt
      - uses: actions/download-artifact@v4
        with:
          name: ${{ needs.plan.outputs.artifact_name }}
          path: .weekly-match-plan/
      - name: Restore trusted immutable baseline
        id: restore
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/run_weekly_match.py restore --manifest "${{ matrix.manifest }}" --audit-dir ".weekly-match-audit/${{ matrix.key }}"
      - name: Review sources and prepare round
        id: prepare
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          CRON_TARGET_URL: ${{ secrets.CRON_TARGET_URL }}
        run: python3 scripts/run_weekly_match.py prepare --manifest "${{ matrix.manifest }}" --audit-dir ".weekly-match-audit/${{ matrix.key }}"
      - name: Persist review before any ingestion
        if: always() && steps.restore.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: weekly-match-review-${{ matrix.key }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: .weekly-match-audit/${{ matrix.key }}/operation-review/
          if-no-files-found: ignore
          include-hidden-files: true
          retention-days: 90
      - name: Persist baseline before publication
        if: steps.prepare.outputs.upload_baseline == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.restore.outputs.artifact_name }}
          path: |
            .weekly-match-audit/${{ matrix.key }}/publication.json
            .weekly-match-audit/${{ matrix.key }}/publication.sources.json
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 90
      - name: Persist settlement evidence before ingestion
        if: steps.prepare.outputs.action == 'settle'
        uses: actions/upload-artifact@v4
        with:
          name: weekly-match-settlement-${{ matrix.key }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: .weekly-match-audit/${{ matrix.key }}/settlement/
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 90
      - name: Apply stored input
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          CRON_TARGET_URL: ${{ secrets.CRON_TARGET_URL }}
        run: python3 scripts/run_weekly_match.py apply --manifest "${{ matrix.manifest }}" --audit-dir ".weekly-match-audit/${{ matrix.key }}"
      - name: Retain operation result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: weekly-match-operation-${{ matrix.key }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            .weekly-match-audit/${{ matrix.key }}/plan.json
            .weekly-match-audit/${{ matrix.key }}/receipt.json
            .weekly-match-audit/${{ matrix.key }}/failure.json
          if-no-files-found: ignore
          include-hidden-files: true
          retention-days: 90

  notify:
    needs: [plan, operate]
    if: always() && github.repository == 'byunginhb/sector-king' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      issues: write
    steps:
      - name: Update one operational incident
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PLAN_RESULT: ${{ needs.plan.result }}
          OPERATE_RESULT: ${{ needs.operate.result }}
          REVIEW_PASSED: ${{ needs.operate.outputs.review_passed }}
        run: |
          title='[섹터 매치 자동 운영] 확인 필요'
          issue=$(gh issue list --state open --search '"[섹터 매치 자동 운영] 확인 필요" in:title' --limit 100 --json number,title --jq '.[] | select(.title == "[섹터 매치 자동 운영] 확인 필요") | .number' | head -n 1)
          body="$RUNNER_TEMP/weekly-match-incident.md"
          if [[ "$PLAN_RESULT" == 'failure' || "$PLAN_RESULT" == 'cancelled' || "$OPERATE_RESULT" == 'failure' || "$OPERATE_RESULT" == 'cancelled' ]]; then
            cat > "$body" <<EOF
          섹터 매치 자동 운영이 완료되지 않았습니다. 게시 검수 실패 시 새 대진을 만들지 않으며 기존 원장을 보존합니다.

          실행: https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}
          계획: ${PLAN_RESULT}, 라운드 처리: ${OPERATE_RESULT}

          Actions의 review/operation artifact에서 원인과 원본을 확인하세요. 다음 예약 실행에서 다시 확인하며, 마감을 연장하거나 확정 결과를 덮어쓰지 않습니다.
          EOF
            if [[ -n "$issue" ]]; then
              gh issue edit "$issue" --body-file "$body"
            else
              gh issue create --title "$title" --body-file "$body"
            fi
          elif [[ "$PLAN_RESULT" == 'success' && "$OPERATE_RESULT" == 'success' && "$REVIEW_PASSED" == 'true' && -n "$issue" ]]; then
            gh issue close "$issue" --reason completed
          fi
